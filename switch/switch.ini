[binaries]
c = 'aarch64-none-elf-gcc'
cpp = 'aarch64-none-elf-g++'
ar = 'aarch64-none-elf-gcc-ar'
strip = 'aarch64-none-elf-strip'
pkgconfig = 'pkg-config'
# Prevent Meson from trying to run Switch binaries while configuring
exe_wrapper = ['echo', 'Skipping execution']

[properties]
needs_exe_wrapper = true
sys_root = '/opt/devkitpro'
pkg_config_libdir = '/opt/devkitpro/portlibs/switch/lib/pkgconfig:/opt/devkitpro/libnx/lib/pkgconfig'

[built-in options]
# Compile mkxp-z as PIE (code+data position-independent)
c_args = [
    '-D__SWITCH__',
    '-DMKXP_BACKEND_GLES2',
    '-Dunix',
    '-march=armv8-a',
    '-mtune=cortex-a57',
    '-mtp=soft',
    '-fPIE',
    '-I/opt/devkitpro/libnx/include',
    '-I/opt/devkitpro/portlibs/switch/include',
    '-I/opt/devkitpro/portlibs/switch/include/uchardet',
    '-I/opt/devkitpro/portlibs/switch/include/SDL2',
    '-I/opt/devkitpro/portlibs/switch/include/AL',
    '-I/opt/devkitpro/portlibs/switch/include/pixman-1',
    '-I/workspace/libs/ruby-switch/include/ruby-3.2.0',
    '-I/workspace/libs/ruby-switch/include/ruby-3.2.0/aarch64-linux',
    '-I/workspace/libs/ruby-switch/include/ruby-3.2.0/ruby',
    '-I/workspace/libs/physfs-switch/include',
    '-I/workspace/libs/SDL_sound-switch/include',
    '-Wno-error=implicit-function-declaration',
    '-include', '/workspace/switch/assert_wrapper.h'
    ]

cpp_args = [
    '-D__SWITCH__',
    '-DMKXP_BACKEND_GLES2',
    '-Dunix',
    '-march=armv8-a',
    '-mtune=cortex-a57',
    '-mtp=soft',
    '-fPIE',
    '-I/opt/devkitpro/libnx/include',
    '-I/opt/devkitpro/portlibs/switch/include',
    '-I/opt/devkitpro/portlibs/switch/include/uchardet',
    '-I/opt/devkitpro/portlibs/switch/include/SDL2',
    '-I/opt/devkitpro/portlibs/switch/include/AL',
    '-I/opt/devkitpro/portlibs/switch/include/pixman-1',
    '-I/workspace/libs/ruby-switch/include/ruby-3.2.0',
    '-I/workspace/libs/ruby-switch/include/ruby-3.2.0/aarch64-linux',
    '-I/workspace/libs/ruby-switch/include/ruby-3.2.0/ruby',
    '-I/workspace/libs/physfs-switch/include',
    '-I/workspace/libs/SDL_sound-switch/include',
    '-Wno-error=implicit-function-declaration',
    '-include', '/workspace/switch/assert_wrapper.h'
    ]

# Link with PIC standard libraries to avoid TEXTREL
c_link_args = [
    '-specs=/opt/devkitpro/libnx/switch.specs',
    '-L/opt/devkitpro/devkitA64/aarch64-none-elf/lib/pic',
    '-L/opt/devkitpro/devkitA64/lib/gcc/aarch64-none-elf/15.1.0/pic',
    '-L/opt/devkitpro/portlibs/switch/lib',
    '-L/opt/devkitpro/libnx/lib',
    '-L/workspace/libs/ruby-switch/lib',
    '-L/workspace/libs/physfs-switch/lib',
    '-L/workspace/libs/SDL_sound-switch/lib',
    '-lEGL',
    '-lGLESv2',
    '-lharfbuzz'
    ]

cpp_link_args = [
    '-specs=/opt/devkitpro/libnx/switch.specs',
    '-L/opt/devkitpro/devkitA64/aarch64-none-elf/lib/pic',
    '-L/opt/devkitpro/devkitA64/lib/gcc/aarch64-none-elf/15.1.0/pic',
    '-L/opt/devkitpro/portlibs/switch/lib',
    '-L/opt/devkitpro/libnx/lib',
    '-L/workspace/libs/ruby-switch/lib',
    '-L/workspace/libs/physfs-switch/lib',
    '-L/workspace/libs/SDL_sound-switch/lib',
    '-lEGL',
    '-lGLESv2',
    '-lharfbuzz'
    ]

[host_machine]
system = 'switch'
cpu_family = 'aarch64'
cpu = 'cortex-a57'
endian = 'little'